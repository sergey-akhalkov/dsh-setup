packages:
  # Only plugin packages are pnpm workspace projects. The setup bundle is a
  # publishable package with vendored plugin copies under its own node_modules;
  # a workspace install would prune those copies, so it stays outside the workspace.
  - packages/plugin-*

autoInstallPeers: false
linkWorkspacePackages: true

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@openai/codex@0.169.0-darwin-arm64 || 0.169.0-darwin-x64 || 0.169.0-linux-arm64 || 0.169.0-linux-x64 || 0.169.0-win32-arm64 || 0.169.0-win32-x64 || 0.169.0"
