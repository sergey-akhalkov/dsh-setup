name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the supported DSH versions
        id: read
        run: |
          versions=$(node -p "JSON.stringify(require('./dsh.json').supportedVersions)")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  validate:
    needs: versions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One global install keeps every CLI call in the checks below off the
      # `pnpm dlx` cache path, so a slow registry cannot stall a single step.
      - name: Install the published DSH CLI under test
        run: pnpm add -g @deepseek-ai/dsh@${{ matrix.dsh }}

      - name: Build committed runtime from sources
        run: pnpm build

      - name: Reject committed runtime that differs from a fresh build
        run: git diff --exit-code

      - name: Reject generated files that differ from their sources
        run: pnpm gen:check

      - name: Type-check
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Validate repository manifests and scans
        run: pnpm validate:repo

      - name: Validate the composed profile with the published DSH CLI
        env:
          DSH_CLI: dsh
        run: pnpm validate:composition

      - name: Exercise the one-command installer on a throwaway profile
        env:
          DSH_CLI: dsh
          DSH_VERSION: ${{ matrix.dsh }}
        run: pnpm validate:installer
