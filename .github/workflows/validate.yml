name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read the supported DSH versions
        id: read
        run: |
          versions=$(node -p "JSON.stringify(require('./dsh.json').supportedVersions)")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  validate:
    needs: versions
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install the published CLI once, outside the repository, so the checks
      # below reuse one installation instead of a `pnpm dlx` resolution per call.
      - name: Install the published DSH CLI under test
        shell: pwsh
        run: |
          $cliDir = Join-Path $env:RUNNER_TEMP "dsh-cli-${{ matrix.dsh }}"
          New-Item -ItemType Directory -Force $cliDir | Out-Null
          Set-Content -Path (Join-Path $cliDir 'package.json') -Value '{"name":"dsh-cli","private":true}'
          pnpm --dir $cliDir add --config.strict-dep-builds=false "@deepseek-ai/dsh@${{ matrix.dsh }}"
          $bin = Join-Path $cliDir 'node_modules/.bin/dsh.CMD'
          if (-not (Test-Path -LiteralPath $bin)) { throw "The DSH CLI shim was not created at $bin" }
          "DSH_CLI=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build committed runtime from sources
        run: pnpm build

      - name: Reject committed runtime that differs from a fresh build
        run: git diff --exit-code

      - name: Reject generated files that differ from their sources
        run: pnpm gen:check

      - name: Type-check
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Validate repository manifests and scans
        run: pnpm validate:repo

      - name: Validate the composed profile with the published DSH CLI
        run: pnpm validate:composition

      - name: Exercise the one-command installer on a throwaway profile
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: pnpm validate:installer
