# Generated from every package cordis.fragment.yml and defaults.yml by
# scripts/generate.ts; do not edit. Run `pnpm gen` after changing a fragment
# or a default.
#
# Layer order: all plugin rows mount first, then owner defaults override the
# shipped rows they name. A profile cordis.patch.yml still outranks this layer.
- insert:
    - id: dsh-setup-composer-clock
      name: "@dsh-setup/plugin-composer-clock"
    - id: dsh-setup-nuphus-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: nuphus-mcp
        transport: stdio
        command: nuphus-mcp
        args:
          - --confirm-write
        toolCallTimeoutMs: 120000
        failOnStartupError: false
    - id: dsh-setup-nuphus-guidance
      name: "@dsh-setup/plugin-nuphus-mcp"
    - id: dsh-setup-ponytail
      name: "@dsh-setup/plugin-ponytail"
    - id: dsh-setup-rust
      name: "@dsh-setup/plugin-rust"
    - id: dsh-setup-serena
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: serena
        transport: stdio
        command: uvx
        args:
          - --from
          - serena-agent==1.7.0
          - serena
          - start-mcp-server
          - --context=vscode
          - --enable-web-dashboard=false
        toolCallTimeoutMs: 120000
        failOnStartupError: false
    - id: dsh-setup-serena-guidance
      name: "@dsh-setup/plugin-serena"
    - id: dsh-setup-working-principles
      name: "@dsh-setup/plugin-working-principles"
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-theme
  config:
    preference: dark
- id: ui-chat
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: cordis
