# Composition fragment for @dsh-setup/plugin-nuphus-mcp.
#
# A configuration-only adapter: the row mounts the Harness-provided MCP client
# instead of this package, because the package has no Host or Client module.
# `dsh-setup/scripts/generate.ts` rejects a foreign row on a code-bearing
# package, and the row id must stay globally unique.
rows:
  - id: dsh-setup-nuphus-mcp
    name: "@deepseek-ai/dsh-mcp-client"
    config:
      serverName: nuphus-mcp
      transport: stdio
      # The npm global install puts this command on the PATH; the server is not
      # vendored and is not installed by the bundle. See docs/install.md.
      command: nuphus-mcp
      args:
        # Strict confirmation: machine-mutating tools need the call's explicit
        # confirmation argument. Relaxing it is a profile-level override.
        - "--confirm-write"
      # Screenshots and the first local-OCR call exceed the 60s bridge default.
      toolCallTimeoutMs: 120000
      # A missing binary must not reject the row; the Harness starts without the
      # desktop tools and logs the failed connection.
      failOnStartupError: false
