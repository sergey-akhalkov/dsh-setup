# Owner defaults for the setup bundle.
#
# An entry targets a composition row by id, shipped or inserted by this setup, and
# carries either the row's complete configuration (a patch replaces the whole
# `config` object rather than merging into it), an explicit `disabled` toggle, or
# both. These values are the baseline every machine receives when it installs the
# setup bundle; a profile's own cordis.patch.yml still wins over them, so
# machine-local preferences remain the user's.
#
# Order is precedence within this layer: keep rows independent.
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-theme
  config:
    preference: dark
- id: ui-chat
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: cordis
# Both shipped MCP servers are dormant behind the lazy proxy; the setup mounts no
# static adapter row. A profile that wants a static adapter adds its own
# `@deepseek-ai/dsh-mcp-client` row and empties the lazy `servers` list (see
# docs/install.md and docs/lazy-mcp.md). A profile override replaces this whole
# list, so restate every server it needs.
- id: dsh-setup-mcp-lazy
  config:
    servers:
      - serverName: nuphus-mcp
        transport: stdio
        command: nuphus-mcp
        args:
          - --confirm-write
        toolCallTimeoutMs: 120000
      - serverName: serena
        transport: stdio
        command: uvx
        args:
          - --from
          - serena-agent==1.7.0
          - serena
          - start-mcp-server
          - --context=vscode
          - --enable-web-dashboard=false
          - --enable-gui-log-window=false
        toolCallTimeoutMs: 120000
# The memory export is on by default and writes every bank into a dedicated
# private Git repository. A configuration patch replaces the whole object, so
# the connection keys are restated with it. The directory and remote are
# machine-local (`~/.dsh/hindsight-export.json`) and never live here.
- id: dsh-setup-hindsight
  config:
    serverMode: self-hosted
    apiUrl: http://127.0.0.1:8888
    autostart: true
    export:
      enabled: true
      intervalMinutes: 5
      autoCommit: true
      autoPush: true
      includeHistory: false
      includeAttachments: false
      importOnEmpty: false
