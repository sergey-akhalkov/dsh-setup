# Owner defaults for the setup bundle.
#
# An entry targets a composition row by id, shipped or inserted by this setup, and
# carries either the row's complete configuration (a patch replaces the whole
# `config` object rather than merging into it), an explicit `disabled` toggle, or
# both. These values are the baseline every machine receives when it installs the
# setup bundle; a profile's own cordis.patch.yml still wins over them, so
# machine-local preferences remain the user's.
#
# Order is precedence within this layer: keep rows independent.
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: max
- id: ui-theme
  config:
    preference: dark
- id: ui-chat
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: cordis
# Both shipped MCP servers are dormant behind the lazy proxy; the setup mounts no
# static adapter row. A profile that wants a static adapter adds its own
# `@deepseek-ai/dsh-mcp-client` row and empties the lazy `servers` list (see
# docs/install.md and docs/lazy-mcp.md). A profile override replaces this whole
# list, so restate every server it needs.
- id: dsh-setup-mcp-lazy
  config:
    servers:
      - serverName: nuphus-mcp
        transport: stdio
        command: nuphus-mcp
        args:
          - --confirm-write
        toolCallTimeoutMs: 120000
      - serverName: serena
        transport: stdio
        command: uvx
        args:
          - --from
          - serena-agent==1.7.0
          - serena
          - start-mcp-server
          - --context=vscode
          - --enable-web-dashboard=false
          - --enable-gui-log-window=false
        toolCallTimeoutMs: 120000
# The memory export is on by default and writes every bank into a dedicated
# private Git repository. A configuration patch replaces the whole object, so
# the connection keys are restated with it. The directory and remote are
# machine-local (`~/.dsh/hindsight-export.json`) and never live here.
- id: dsh-setup-hindsight
  config:
    serverMode: self-hosted
    apiUrl: http://127.0.0.1:8888
    autostart: true
    export:
      enabled: true
      intervalMinutes: 5
      autoCommit: true
      autoPush: true
      includeHistory: false
      includeAttachments: false
      importOnEmpty: false
# Observability signal map: attributes tool calls, injected messages, aborts,
# and commands to the shipped plugin that produces them. Rows are declarative
# data, never code. A plugin rename or removal fails the map's test instead of
# silently blanking a row, and a row id is the plugin's short name
# (`<id>` in `@dsh-setup/plugin-<id>`). A configuration patch replaces the
# whole object, so a profile override must restate every row it needs.
- id: dsh-setup-observability
  config:
    rows:
      - id: delegation-rules
        label: Delegation rules
        kind: signal
        match:
          - tool: delegate
          - tool: task_progress
          - tool: delegation_status
          - sourceKind: delegation-rules
      - id: mcp-lazy
        label: Lazy MCP
        kind: signal
        match:
          - tool: mcp_tools
          - tool: mcp_call
      - id: codex-subagent
        label: Codex subagent
        kind: signal
        match:
          - tool: codex_subagent_status
      - id: goal-continuity
        label: Goal continuity
        kind: signal
        match:
          - sourceKind: goal-continuity
      - id: verification-gate
        label: Verification gate
        kind: signal
        match:
          - sourceKind: verification-gate
      - id: loop-guard
        label: Loop guard
        kind: signal
        match:
          - sourceKind: loop-guard
          - abortPrefix: "loop-guard:reset:"
          - abortPrefix: "loop-guard:final:"
      - id: admin-indicator
        label: Administrator indicator
        kind: signal
        match:
          - command: admin-shortcut
          - command: admin-restart
      - id: ponytail
        label: Ponytail
        kind: guidance
      - id: working-principles
        label: Working principles
        kind: guidance
      - id: rtk
        label: RTK
        kind: guidance
      - id: serena
        label: Serena
        kind: guidance
      - id: nuphus-mcp
        label: Nuphus MCP
        kind: guidance
      - id: openspec
        label: OpenSpec
        kind: guidance
      - id: rust
        label: Rust
        kind: guidance
      - id: answer-page
        label: Answer page
        kind: guidance
      - id: hindsight
        label: Hindsight memory
        kind: signal
        match:
          - tool: hindsight_search_knowledge_pages
          - tool: hindsight_list_knowledge_pages
          - tool: hindsight_read_knowledge_page
          - tool: hindsight_reflect
          - tool: hindsight_capture_initiative
          - tool: hindsight_ingest_document
          - tool: hindsight_diagnose
          - tool: hindsight_sync_status
