# Owner defaults for the setup bundle.
#
# An entry targets a composition row by id, shipped or inserted by this setup, and
# carries either the row's complete configuration (a patch replaces the whole
# `config` object rather than merging into it), an explicit `disabled` toggle, or
# both. These values are the baseline every machine receives when it installs the
# setup bundle; a profile's own cordis.patch.yml still wins over them, so
# machine-local preferences remain the user's.
#
# Order is precedence within this layer: keep rows independent.
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: max
- id: ui-theme
  config:
    preference: dark
- id: ui-chat
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: cordis
# Both shipped MCP servers are dormant behind the lazy proxy; the setup mounts no
# static adapter row. A profile that wants a static adapter adds its own
# `@deepseek-ai/dsh-mcp-client` row and empties the lazy `servers` list (see
# docs/install.md and docs/lazy-mcp.md). A profile override replaces this whole
# list, so restate every server it needs.
- id: dsh-setup-mcp-lazy
  config:
    servers:
      - serverName: nuphus-mcp
        transport: stdio
        command: nuphus-mcp
        args:
          - --confirm-write
        toolCallTimeoutMs: 120000
      - serverName: serena
        transport: stdio
        command: uvx
        args:
          - --from
          - serena-agent==1.7.0
          - serena
          - start-mcp-server
          - --context=vscode
          - --enable-web-dashboard=false
          - --enable-gui-log-window=false
        toolCallTimeoutMs: 120000
# The memory export is on by default and writes every bank into a dedicated
# private Git repository. A configuration patch replaces the whole object, so
# the connection keys are restated with it. The directory and remote are
# machine-local (`~/.dsh/hindsight-export.json`) and never live here.
- id: dsh-setup-hindsight
  config:
    serverMode: self-hosted
    apiUrl: http://127.0.0.1:8888
    autostart: true
    export:
      enabled: true
      intervalMinutes: 5
      autoCommit: true
      autoPush: true
      includeHistory: false
      includeAttachments: false
      importOnEmpty: false
# Observability signal map: attributes tool calls, injected messages, aborts,
# and commands to the shipped plugin that produces them. Rows are declarative
# data, never code. A plugin rename or removal fails the map's test instead of
# silently blanking a row, and a row id is the plugin's short name
# (`<id>` in `@dsh-setup/plugin-<id>`). Every row carries a `trigger` sentence
# shown while it is silent, and every guidance row declares the prompt section
# and/or skill its plugin must contribute (`mounted`), so a broken delivery is
# distinguishable from a plugin that simply never fired. A configuration patch
# replaces the whole object, so a profile override must restate every row it
# needs.
- id: dsh-setup-observability
  config:
    rows:
      - id: delegation-rules
        label: Delegation rules
        kind: signal
        trigger: a delegation rule runs through the delegate tool or a progress note is recorded
        goal: delegation shortens the work it can split
        match:
          - tool: delegate
          - tool: task_progress
          - tool: delegation_status
          - sourceKind: delegation-rules
        eligible:
          - tool: edit
          - tool: write
      - id: mcp-lazy
        label: Lazy MCP
        kind: signal
        trigger: a tool is discovered or called through the lazy MCP server
        goal: MCP tools are discovered only when a task needs them
        match:
          - tool: mcp_tools
          - tool: mcp_call
      - id: codex-subagent
        label: Codex subagent
        kind: signal
        trigger: the Codex subagent status is inspected
        goal: an independent reviewer or worker answers a question
        match:
          - tool: codex_subagent_status
      - id: goal-continuity
        label: Goal continuity
        kind: signal
        trigger: a goal is supervised, a block is reviewed, or a work checkpoint is recorded
        goal: a goal runs to completion with fewer human messages
        match:
          - sourceKind: goal-continuity
          - tool: work_checkpoint
        eligible:
          - tool: edit
          - tool: write
      - id: verification-gate
        label: Verification gate
        kind: signal
        trigger: the verification gate steers a turn close
        goal: a turn closes only with evidence
        match:
          - sourceKind: verification-gate
        eligible:
          - tool: edit
          - tool: write
      - id: loop-guard
        label: Loop guard
        kind: signal
        trigger: a repeated tool loop is detected and the turn is reset or aborted
        goal: a repeated loop is stopped before it wastes the turn
        match:
          - sourceKind: loop-guard
          - abortPrefix: "loop-guard:reset:"
          - abortPrefix: "loop-guard:final:"
      - id: admin-indicator
        label: Administrator indicator
        kind: signal
        trigger: an admin shortcut or restart command runs
        goal: an administrator action is explicit and attributable
        match:
          - command: admin-shortcut
          - command: admin-restart
      - id: ponytail
        label: Ponytail
        kind: guidance
        trigger: the always-on ruleset is assembled or the ponytail skill is loaded
        goal: the smallest change that fully solves the task
        mounted:
          section: "dsh-setup:ponytail"
          skill: ponytail
      - id: working-principles
        label: Working principles
        kind: guidance
        trigger: the working contract is assembled or one of its skills is loaded
        goal: scope, evidence, and handoff rules are followed
        mounted:
          section: "dsh-setup:working-principles"
          skill: working-principles
      - id: rtk
        label: RTK
        kind: guidance
        trigger: the RTK rules are assembled or the rtk skill is loaded
        goal: bulky command output stays bounded and readable
        mounted:
          section: "dsh-setup:rtk"
          skill: rtk
      - id: serena
        label: Serena
        kind: guidance
        trigger: the Serena rules are assembled or the serena-discipline skill is loaded
        goal: symbol-level edits name their exact callers
        mounted:
          section: "dsh-setup:serena"
          skill: serena-discipline
      - id: nuphus-mcp
        label: Nuphus MCP
        kind: guidance
        trigger: the nuphus-discipline skill is loaded
        goal: browser work is verified after every navigation
        mounted:
          skill: nuphus-discipline
      - id: openspec
        label: OpenSpec
        kind: guidance
        trigger: an OpenSpec skill is loaded
        goal: a change is proposed, applied, and archived by its artifacts
        mounted:
          skill: openspec-propose
      - id: rust
        label: Rust
        kind: guidance
        trigger: the rust skill is loaded
        goal: Rust edits follow the project's toolchain and checks
        mounted:
          skill: rust
      - id: answer-page
        label: Answer page
        kind: guidance
        trigger: the answer-me-with-html skill is loaded
        goal: a visual answer is rendered as one self-contained page
        mounted:
          skill: answer-me-with-html
      - id: hindsight
        label: Hindsight memory
        kind: signal
        trigger: memory is searched, captured, or exported
        goal: past decisions are recalled before the code is re-derived
        match:
          - tool: hindsight_search_knowledge_pages
          - tool: hindsight_list_knowledge_pages
          - tool: hindsight_read_knowledge_page
          - tool: hindsight_reflect
          - tool: hindsight_capture_initiative
          - tool: hindsight_ingest_document
          - tool: hindsight_diagnose
          - tool: hindsight_sync_status
    hypotheses:
      - description: goal continuity reduces the steps a human message needs
        metric: steps-per-human-message
        direction: decrease
        threshold: 0.5
        window: week
        minSamples: 20
        guardrail: failure-rate
      - description: delegation reduces the active minutes a task needs
        metric: active-minutes-per-episode
        direction: decrease
        threshold: 5
        window: week
        minSamples: 20
        guardrail: failure-rate
# The workflows engine owns the checkpoint, task-review and verification closes
# in this release; the verification-gate row stays installed but disabled for
# one release. The verify definition has no shipped commands, matching the
# inert legacy row, until a profile configures them.
- id: dsh-setup-workflows
  config:
    checkpointApplicability:
      minToolCalls: 4
      requireWrite: true
      bottleneckAge: 2
      stepInterval: 40
      enforceParallel: true
    verify:
      commands: []
      maxBlocks: 8
- id: dsh-setup-verification-gate
  disabled: true

# The retired gates are switched off only for the setup bundle; standalone
# plugin installs keep their legacy enforcement.
- id: dsh-setup-goal-continuity
  config:
    enabled: true
    resumeAfterRestart: false
    resumeAfterUserStop: non-goal
    maxSessionResumes: 20
    roundExtension: 1000
    maxRoundExtensions: 2
    hardMaxGoalRounds: 5000
    blockReview:
      enabled: true
      reviewQuestions: true
      provider: spawn
      model: deepseek-flash
      reasoningEffort: max
      reviewerPreset: goal-reviewer
      blockedAfterConsecutiveRounds: 3
      timeoutMs: 300000
      maxReviewsPerGoal: 3
      onReviewError: deny
      onUnavailable: allow
      onExhausted: deny
    checkpoint:
      enabled: true
      minToolCalls: 4
      requireWrite: true
      maxBlocks: 3
      enforceParallel: true
      maxMessageChars: 1200
      stepInterval: 40
      bottleneckAge: 2
      laneStaleCheckpoints: 2
      automation: false
- id: dsh-setup-delegation-rules
  config:
    targets:
      codex:
        provider: codex-subagent
        model: gpt-6-astra
        reasoningEffort: xhigh
      codex-write:
        provider: codex-subagent-write
        write: true
        model: gpt-6-astra
        reasoningEffort: xhigh
      codex-astra:
        provider: codex-subagent
        model: gpt-6-astra
        reasoningEffort: xhigh
      worker-fast:
        provider: spawn
        reasoningEffort: high
      worker-deep:
        provider: spawn
        reasoningEffort: max
    rules:
      - id: spec-review
        when: spec-ready
        to: codex
        contract: review
        phase: spec
        scope: whole
        gate: strict
        instruction: bundled:review-spec
      - id: task-review
        when: spec-task-ready
        to: codex
        contract: review
        scope: task
        gate: strict
        instruction: bundled:review-task
      - id: blocker
        when: failure-streak
        to: codex
        contract: answer
        gate: soft
        instruction: bundled:consult
      - id: research
        when: manual
        to: codex
        contract: answer
        gate: none
        instruction: bundled:research
      - id: advisor
        when: manual
        to: codex-astra
        contract: answer
        gate: none
        instruction: bundled:advisor
      - id: worker-fast
        when: manual
        to: worker-fast
        contract: answer
        gate: none
        instruction: bundled:research
      - id: worker-deep
        when: manual
        to: worker-deep
        contract: answer
        gate: none
        instruction: bundled:research
      - id: bug-fix
        when: manual
        to: codex-write
        contract: patch
        gate: none
        instruction: bundled:fix
        isolation: worktree
      - id: integration-review
        when: implementation-complete
        to: codex
        contract: review
        phase: integration
        scope: whole
        gate: soft
        instruction: bundled:review-integration
      - id: lane-fanout
        when: lane-assignment
        contract: note
        gate: strict
      - id: task-progress
        when: implementation-work
        contract: note
        gate: strict
      - id: lane-boundary
        when: lane-boundary
        contract: note
        gate: strict
    timeouts:
      review: 600000
      answer: 300000
      patch: 1800000
    failureStreak: 3
    reviewLearning:
      enabled: true
      window: 50
      maxLessons: 200
    gates:
      workflowOwned: false
