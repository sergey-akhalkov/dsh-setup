schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  archive:
    guidance:
      - "Run `pnpm reviews:check --change <name>` before archiving: every checked task needs a committed `reviews/<taskId>.json` task-review PASS."
      - "The delegation-rules archive gate refuses `openspec archive` and `mv`/`Move-Item`/`git mv` into `openspec/changes/archive/` until every checked task is approved; the change stays active."
      - "`pnpm reviews:check --all` reports the v0.12.0 exception and the pre-cutoff historical baseline; a post-cutoff archive or a later modification of any archive must satisfy the normal rule."
